spring.application.name=virtual-paddock-back

# ========== Server ==========
server.port=8080

# ========== MySQL Database ==========
spring.datasource.url=jdbc:mysql://localhost:3306/virtual_paddock_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Rig0bert0.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== JPA / Hibernate ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ========== Springdoc OpenAPI (Swagger) ==========
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ========== Actuator ==========
management.endpoints.web.exposure.include=health,info

# ========== JWT Security ==========
# Secret Key generada segura (min 256 bits for HMAC-SHA256)

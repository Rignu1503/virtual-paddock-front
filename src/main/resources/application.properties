spring.application.name=virtual-paddock-back

# ========== Server ==========
server.port=8080
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# ========== MySQL Database ==========
spring.datasource.url=jdbc:mysql://localhost:3306/virtual_paddock_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Rig0bert0.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ========== JPA / Hibernate ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# ========== Springdoc OpenAPI (Swagger) ==========
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ========== Actuator ==========
management.endpoints.web.exposure.include=health,info

# ========== JWT Security ==========
# Secret Key generada segura (min 256 bits for HMAC-SHA256)
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiración: 15 minutos = 900000 ms
application.security.jwt.expiration=900000
# Refresh Token Expiración: 7 días = 604800000 ms
application.security.jwt.refresh-token.expiration=604800000
# Configuración de Cookie (false para desarrollo HTTP local, true para producción HTTPS)
application.security.cookie.secure=false
# Orígenes CORS permitidos (separados por coma)
application.security.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*,https://*.pages.dev,https://*.web.app,https://*.firebaseapp.com

